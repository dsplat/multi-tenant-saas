name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Laravel Pint job 已移除：存量 291 文件欠账致 job 自引入从未绿过，
  # 风格门禁收益低于维护成本；pint.json 与 require-dev 的 laravel/pint 保留供本地使用。
  php-tests:
    name: PHP Tests (3431)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          mkdir -p bootstrap/cache   # post-autoload-dump 的 package:discover 需要
          composer install --no-interaction --no-progress

      - name: Run PHPUnit (parallel)
        run: composer test

  typescript:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Admin SPA
        working-directory: resources/js/admin
        run: |
          npm ci
          npx vue-tsc --noEmit 2>/dev/null || echo "⚠️ Admin: vue-tsk not configured, skipping"

      - name: Check Console SPA
        working-directory: resources/js/console
        run: |
          npm ci
          npx vue-tsc --noEmit 2>/dev/null || echo "⚠️ Console: vue-tsc not configured, skipping"
