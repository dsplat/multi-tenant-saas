name: Split Monorepo
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - prefix: ''
            repo: multi-tenant-saas
          - prefix: 'src/Modules/Ai'
            repo: multi-tenant-saas-module-ai
          - prefix: 'src/Modules/AiStreaming'
            repo: multi-tenant-saas-module-ai-streaming
            node_build: true
          - prefix: 'src/Modules/ApiToken'
            repo: multi-tenant-saas-module-api-token
          - prefix: 'src/Modules/Auth'
            repo: multi-tenant-saas-module-auth
          - prefix: 'src/Modules/Billing'
            repo: multi-tenant-saas-module-billing
          - prefix: 'src/Modules/ActivityPlan'
            repo: multi-tenant-saas-module-activity-plan
          - prefix: 'src/Modules/Commerce'
            repo: multi-tenant-saas-module-commerce
          - prefix: 'src/Modules/Contracts'
            repo: multi-tenant-saas-module-contracts
          - prefix: 'src/Modules/Conversation'
            repo: multi-tenant-saas-module-conversation
          - prefix: 'src/Modules/Coupon'
            repo: multi-tenant-saas-module-coupon
          - prefix: 'src/Modules/Course'
            repo: multi-tenant-saas-module-course
          - prefix: 'src/Modules/DeveloperPortal'
            repo: multi-tenant-saas-module-developer-portal
          - prefix: 'src/Modules/Domain'
            repo: multi-tenant-saas-module-domain
          - prefix: 'src/Modules/Event'
            repo: multi-tenant-saas-module-event
          - prefix: 'src/Modules/Form'
            repo: multi-tenant-saas-module-form
          - prefix: 'src/Modules/Ibot'
            repo: multi-tenant-saas-module-ibot
          - prefix: 'src/Modules/Infrastructure'
            repo: multi-tenant-saas-module-infrastructure
          - prefix: 'src/Modules/Knowledge'
            repo: multi-tenant-saas-module-knowledge
          - prefix: 'src/Modules/Logging'
            repo: multi-tenant-saas-module-logging
          - prefix: 'src/Modules/Logistics'
            repo: multi-tenant-saas-module-logistics
          - prefix: 'src/Modules/Lottery'
            repo: multi-tenant-saas-module-lottery
          - prefix: 'src/Modules/Monitoring'
            repo: multi-tenant-saas-module-monitoring
          - prefix: 'src/Modules/Notification'
            repo: multi-tenant-saas-module-notification
          - prefix: 'src/Modules/Operator'
            repo: multi-tenant-saas-module-operator
          - prefix: 'src/Modules/Order'
            repo: multi-tenant-saas-module-order
          - prefix: 'src/Modules/Pay'
            repo: multi-tenant-saas-module-pay
          - prefix: 'src/Modules/Payment'
            repo: multi-tenant-saas-module-payment
          - prefix: 'src/Modules/Platform'
            repo: multi-tenant-saas-module-platform
          - prefix: 'src/Modules/Plugin'
            repo: multi-tenant-saas-module-plugin
          - prefix: 'src/Modules/Product'
            repo: multi-tenant-saas-module-product
          - prefix: 'src/Modules/Sms'
            repo: multi-tenant-saas-module-sms
          - prefix: 'src/Modules/SSL'
            repo: multi-tenant-saas-module-ssl
          - prefix: 'src/Modules/Storage'
            repo: multi-tenant-saas-module-storage
          - prefix: 'src/Modules/Ticket'
            repo: multi-tenant-saas-module-ticket
          - prefix: 'src/Modules/User'
            repo: multi-tenant-saas-module-user
          - prefix: 'src/Modules/Voting'
            repo: multi-tenant-saas-module-voting
          - prefix: 'src/Modules/Wechat'
            repo: multi-tenant-saas-module-wechat
          - prefix: 'src/Modules/WechatWork'
            repo: multi-tenant-saas-module-wechatwork
          - prefix: 'src/Modules/Workflow'
            repo: multi-tenant-saas-module-workflow

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SPLIT_TOKEN }}

      - name: Setup Node (engine build)
        if: matrix.node_build == true
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create repo if needed
        env:
          GH_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          ORG="dsplat"
          REPO="${{ matrix.repo }}"
          if ! gh repo view "$ORG/$REPO" &>/dev/null; then
            echo "Creating repo $ORG/$REPO..."
            gh repo create "$ORG/$REPO" --public
          fi

      - name: Push to ${{ matrix.repo }} via subtree
        run: |
          set -euo pipefail

          ORG="dsplat"
          REPO="${{ matrix.repo }}"
          PREFIX="${{ matrix.prefix }}"
          BRANCH="split-${REPO}"

          echo "Splitting $PREFIX -> $ORG/$REPO"

          # git subtree split
          if [ -n "$PREFIX" ]; then
            git subtree split --prefix="$PREFIX" --branch="$BRANCH"
          else
            BRANCH="main"
          fi

          # Node 引擎构建注入：在 split 分支上构建 dist/server.mjs 并追加提交，
          # 用户 composer 装包即得单文件引擎，无需安装 node_modules
          if [ "${{ matrix.node_build }}" = "true" ]; then
            git worktree add /tmp/split-build "$BRANCH"
            pushd /tmp/split-build
            (cd node && npm ci --no-audit --no-fund)
            (cd node && node build.mjs)
            git add -f dist/server.mjs
            git -c user.name="github-actions[bot]" \
                -c user.email="github-actions[bot]@users.noreply.github.com" \
                commit -m "build: inject Node engine bundle (dist/server.mjs)"
            popd
            git worktree remove --force /tmp/split-build
          fi

          # Push using PAT from checkout token
          git push "https://github.com/${ORG}/${REPO}.git" "${BRANCH}:main" --force

          # Tag push
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            echo "Pushing tag $TAG..."
            git push "https://github.com/${ORG}/${REPO}.git" "${BRANCH}:refs/tags/${TAG}" --force
          fi

          echo "Pushed to $ORG/$REPO"
